<!doctype html>
<!-- Source of public/og.png (1200×630). Mirrors the hero: headline + live-signal trace that becomes the AP mark.
     Re-render: node <playwright script> brand/og-source.html public/og.png (waits for window.__ready). -->
<html lang="es">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,300..900;1,50..150,300..900&family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #0c0d10; --bone: #ece6da; --dim: #a9a397; --line: rgb(236 230 218 / 0.14); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--ink); color: var(--bone); font-family: "Anybody", sans-serif; }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(55% 60% at 80% 108%, rgb(255 46 99 / 0.3), transparent 70%),
      radial-gradient(45% 45% at 8% 115%, rgb(255 91 31 / 0.22), transparent 65%),
      radial-gradient(circle at 1px 1px, rgb(236 230 218 / 0.10) 1px, transparent 1.5px) 0 0 / 20px 20px,
      var(--ink); }
  .scope { position: absolute; inset: 22px;
    background:
      repeating-linear-gradient(90deg, rgb(236 230 218 / 0.05) 0 1px, transparent 1px 10%),
      repeating-linear-gradient(0deg, rgb(236 230 218 / 0.05) 0 1px, transparent 1px 12.5%);
    -webkit-mask: radial-gradient(120% 90% at 50% 50%, #000 40%, transparent 88%); }
  .corner { position: absolute; width: 26px; height: 26px; border: 0 solid rgb(236 230 218 / 0.5); }
  .c1 { top: 22px; left: 22px; border-width: 1px 0 0 1px; } .c2 { top: 22px; right: 22px; border-width: 1px 1px 0 0; }
  .c3 { bottom: 22px; left: 22px; border-width: 0 0 1px 1px; } .c4 { bottom: 22px; right: 22px; border-width: 0 1px 1px 0; }
  svg.signal { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .pill { position: absolute; left: 64px; top: 64px; display: inline-flex; align-items: center; gap: 12px; padding: 10px 16px;
    font: 500 15px "Martian Mono", monospace; font-stretch: 90%; letter-spacing: .02em; text-transform: uppercase;
    color: #9be7c4; background: #0a0f0c; border: 1px solid #1f2a24; border-radius: 4px;
    box-shadow: inset 0 0 22px rgb(155 231 196 / .08); text-shadow: 0 0 8px rgb(155 231 196 / .55); }
  .pill .k { color: #4d6b5c; text-shadow: none; }
  .pill i { width: .6em; height: 1em; background: #9be7c4; box-shadow: 0 0 8px rgb(155 231 196 / .7); }
  .readout { position: absolute; right: 64px; top: 72px; display: flex; gap: 18px; font: 500 14px "Martian Mono", monospace; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .readout b { color: #ff5b1f; font-weight: 500; }
  h1 { position: absolute; left: 62px; top: 190px; margin: 0; font-size: 112px; font-weight: 860; font-stretch: 84%; letter-spacing: -.02em; line-height: .92; }
  h1 span.line { display: block; width: fit-content; }
  .glitch { position: relative; display: inline-block; isolation: isolate;
    background: linear-gradient(90deg, #ff5b1f, #ff2e63 55%, #c79bff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; z-index: -1; }
  .glitch::before { -webkit-text-fill-color: #9be7c4; transform: translate(-.035em, -.015em); }
  .glitch::after { -webkit-text-fill-color: #ff2e63; transform: translate(.035em, .015em); }
  .foot { position: absolute; left: 64px; bottom: 58px; font: 500 19px "Martian Mono", monospace; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .foot strong { color: var(--bone); font-weight: 500; }
  .foot b { color: #ff5b1f; font-weight: 500; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="scope"></div>
  <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
  <svg class="signal" viewBox="0 0 1200 630" aria-hidden="true"></svg>
  <div class="pill"><span class="k">Estado</span><span>Abierto a proyectos</span><span class="k">Loc</span><span>Cádiz · ES</span><i></i></div>
  <div class="readout"><span><b>CH1</b> señal</span><span>440.0 Hz</span><span>9 mV</span></div>
  <h1><span class="line">Construyo software</span><span class="line" id="anchor">que se <span class="glitch" data-text="mueve.">mueve.</span></span></h1>
  <p class="foot"><strong>Adrián Portillo</strong> <b>·</b> Lead Front-End · SaaS · datos e IA · 3D · música</p>

<script>
  // Same geometry as src/hero-signal.js: the flat signal runs under the last line, then writes the AP mark.
  const LOGO_D = 'M8 152 H57.6 L86 46 L129.4 208 V48 C133.8 50.4 138.4 52.8 142.7 55.2 C147.0 57.6 151.4 60.0 155.4 62.4 C159.5 64.8 163.4 67.2 167.0 69.6 C170.6 72.0 174.0 74.4 177.0 76.8 C179.9 79.2 182.6 81.6 184.8 84.0 C187.0 86.4 188.9 88.8 190.3 91.2 C191.6 93.6 192.6 96.0 193.0 98.4 C193.5 100.8 193.5 103.2 193.0 105.6 C192.6 108.0 191.6 110.4 190.3 112.8 C188.9 115.2 187.0 117.6 184.8 120.0 C182.6 122.4 179.9 124.8 177.0 127.2 C174.0 129.6 170.3 132.0 167.0 134.4 C154.0 143.9 150.0 178.0 190.0 176.0';
  const U = { x0: 8, x1: 190, top: 46, bottom: 208, base: 152, tailY: 176 };
  // ?lang=en renders public/og-en.png for the English page
  if (new URLSearchParams(location.search).get('lang') === 'en') {
    document.documentElement.lang = 'en';
    document.querySelector('.pill').innerHTML = '<span class="k">Status</span><span>Open for projects</span><span class="k">Loc</span><span>Cádiz · ES</span><i></i>';
    document.querySelector('.readout').innerHTML = '<span><b>CH1</b> signal</span><span>440.0 Hz</span><span>9 mV</span>';
    document.querySelector('h1').innerHTML = '<span class="line">I build software</span><span class="line" id="anchor">that <span class="glitch" data-text="moves.">moves.</span></span>';
    document.querySelector('.foot').innerHTML = '<strong>Adrián Portillo</strong> <b>·</b> Lead Front-End · SaaS · data &amp; AI · 3D · music';
  }
  document.fonts.ready.then(() => {
    const line = document.getElementById('anchor').getBoundingClientRect();
    const fs = parseFloat(getComputedStyle(document.querySelector('h1')).fontSize);
    const s = (fs * 1.15) / (U.bottom - U.top);
    const ox = line.right + fs * 0.22 - U.x0 * s;
    const oy = line.bottom + fs * 0.1 - U.base * s;
    const X = (u) => ox + u * s, Y = (u) => oy + u * s;
    const w = 22 * 0.78; // logo units
    let lead = `M0 ${Y(U.base).toFixed(1)}`;
    for (let x = 0; x <= X(U.x0); x += 4) {
      const env = 1 - x / X(U.x0);
      lead += ` L${x} ${(Y(U.base) + Math.sin(x * 0.05) * 3 * env).toFixed(1)}`;
    }
    let tail = `M${X(U.x1).toFixed(1)} ${Y(U.tailY).toFixed(1)}`;
    for (let x = X(U.x1); x <= 1210; x += 4) {
      const dx = x - X(U.x1);
      const env = Math.min(1, dx / 60);
      tail += ` L${x.toFixed(1)} ${(Y(U.tailY) + Math.sin(dx * 0.06) * 13 * env).toFixed(1)}`;
    }
    // the light beam that runs along the signal on the site, frozen on the outgoing wave
    let beam = '';
    for (let x = X(U.x1) + 120; x <= X(U.x1) + 162; x += 2) {
      const dx = x - X(U.x1);
      beam += `${beam ? ' L' : 'M'}${x.toFixed(1)} ${(Y(U.tailY) + Math.sin(dx * 0.06) * 13 * Math.min(1, dx / 60)).toFixed(1)}`;
    }
    const g0 = X(U.x0) / 1200, g1 = X(U.x1) / 1200;
    const layer = (stroke, dx, dy) => `
      <g transform="translate(${dx * s} ${dy * s})" fill="none" stroke="${stroke}" stroke-linecap="round" stroke-linejoin="round">
        <path d="${lead}" stroke-width="${w * s}"/><path d="${tail}" stroke-width="${w * s}"/>
        <path d="${LOGO_D}" stroke-width="${w}" transform="translate(${ox} ${oy}) scale(${s})"/>
      </g>`;
    document.querySelector('svg.signal').innerHTML = `
      <defs><linearGradient id="g" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="${g0}" stop-color="#ff5b1f"/><stop offset="${g0 + (g1 - g0) * 0.55}" stop-color="#ff2e63"/><stop offset="${g1}" stop-color="#c79bff"/>
      </linearGradient></defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#ff2e63"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      ${layer('#9be7c4', -7, -3)}${layer('#ff2e63', 7, 3)}${layer('url(#g)', 0, 0)}
      <path d="${beam}" fill="none" stroke="#ece6da" stroke-width="${w * s * 0.42}" stroke-linecap="round" filter="url(#glow)"/>`;
    window.__ready = true;
  });
</script>
</body>
</html>
